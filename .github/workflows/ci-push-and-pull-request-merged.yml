# Registered manual entry point during the feature-branch rollout; see docs/desktop-rollout.md.
name: DataM8 manual desktop verification
on:
  workflow_dispatch:
    inputs:
      windows_update_fixture_run:
        description: 'Optional diagnostic only: reuse signed Windows fixtures from this run ID; empty runs full four-platform acceptance'
        type: string
        required: false
        default: ''
permissions:
  contents: read
  id-token: write
jobs:
  desktop:
    if: inputs.windows_update_fixture_run == ''
    uses: ./.github/workflows/desktop.yml
    with:
      signed: true
    secrets: inherit
  diagnose-windows-updates:
    if: inputs.windows_update_fixture_run != '' && github.ref == 'refs/heads/feature/external_refresh'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: internal-update-fixtures
          path: artifacts/update-fixtures
          run-id: ${{ inputs.windows_update_fixture_run }}
          github-token: ${{ github.token }}
      - name: Configure explicit corporate CA trust on disposable Windows runner
        run: node scripts/windows-test-trust.mjs install
      - name: Diagnose real signed updates using existing fixtures (no final delivery)
        run: npm run test:desktop:updates -- artifacts/update-fixtures
      - name: Remove temporary Windows CA trust
        if: always()
        run: node scripts/windows-test-trust.mjs remove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: windows-update-diagnostics
          path: artifacts/desktop-update-results
          retention-days: 7
