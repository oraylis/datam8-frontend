name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feature/v2-beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install
        run: npm ci

      - name: Ensure Rollup native deps
        run: npm run ci:ensure-rollup-native

      - name: Build datam8 backend wheel
        run: npm run build:datam8-binaries

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (workspaces)
        run: npm --workspaces run test --if-present

      - name: Install Playwright Chromium
        run: npm --workspace apps/web exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Build web (electron mode)
        run: npm run build:web:electron

      - name: Build desktop (no packaging)
        run: npm --workspace apps/desktop run build

      - name: CI gates (no dm8gen/python fallback + backend smoke)
        run: npm run ci:gates
