name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test scripts/ci-scope.test.mjs scripts/check-docs.test.mjs
      - run: node scripts/check-docs.mjs
      - id: scope
        run: node scripts/ci-scope.mjs

  ci:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.0'
          enable-cache: true
          cache-dependency-glob: submodules/datam8-generator/uv.lock

      - name: Install
        run: npm ci

      - name: Match protected release tag to package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('apps/desktop/package.json')).version; if(process.env.GITHUB_REF_NAME !== 'v'+v) throw new Error('Release tag must match desktop package version');"

      - name: Check generated schema types
        run: |
          npm run generate:schema-types
          git diff --exit-code -- apps/web/src/features/model/generated-schema-types.ts

      - name: Build datam8 backend wheel
        run: npm run build:datam8-binaries

      - name: Prepare the pinned backend for real-backend tests
        working-directory: submodules/datam8-generator
        run: uv sync --frozen --all-extras

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (workspaces)
        run: |
          node --test scripts/final-desktop-manifest.test.mjs scripts/recover-v2.1.0.test.mjs
          npm --workspaces run test --if-present

      - name: Install Playwright Chromium
        run: npm --workspace apps/web exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

      - name: Build web (electron mode)
        run: npm run build:web:electron

      - name: CI gates (no dm8gen/python fallback + backend smoke)
        run: npm run ci:gates

      - name: Desktop development launch, local fonts and developer update simulation
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libasound2t64
          xvfb-run -a npm run test:desktop:functions
          xvfb-run -a npm run test:desktop:workspaces
          xvfb-run -a npm run test:desktop:dev
          xvfb-run -a npm run test:desktop:updates:ui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: quality-diagnostics
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/desktop-update-ui-results
            artifacts/desktop-dev-results
            artifacts/desktop-workspace-results
          retention-days: 7

  result:
    name: CI result
    if: always()
    needs: [scope, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/ci-scope.mjs result
        env:
          NEEDS: ${{ toJSON(needs) }}
