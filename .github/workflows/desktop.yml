name: Desktop build and verification
on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: ${{ inputs.signed && 'desktop-signing-v2' || 'desktop-ci' }}
    permissions:
      contents: read
      id-token: write
    env:
      DATAM8_REQUIRE_SIGNING: ${{ inputs.signed && '1' || '0' }}
      # mac.identity is '-' (local ad-hoc): PRs need bundle seals too, without
      # any Apple identity or Vault access. Windows release signing stays gated.
      CSC_FOR_PULL_REQUEST: ${{ matrix.platform == 'mac' && 'true' || 'false' }}
      AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
      AZURE_KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Restrict signing to trusted refs
        if: inputs.signed
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_EVENT_NAME" != push ]]; then exit 1; fi
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/heads/feature/external_refresh && "$GITHUB_REF" != refs/tags/v* ]]; then exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${{ github.ref_protected }}" != true ]]; then exit 1; fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: inputs.signed && matrix.platform == 'win'
        with:
          dotnet-version: '8.0.x'
      - name: Install AzureSignTool
        if: inputs.signed && matrix.platform == 'win'
        run: dotnet tool install --global AzureSignTool --version 6.0.0
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: inputs.signed && matrix.platform == 'win'
        with:
          client-id: ${{ vars.AZURE_V2_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_KEY_VAULT_TENANT }}
          allow-no-subscriptions: true
      - name: Configure explicit corporate CA trust on disposable Windows runner
        if: inputs.signed && matrix.platform == 'win'
        run: node scripts/windows-test-trust.mjs install
      - name: Validate Windows signing certificate
        if: inputs.signed && matrix.platform == 'win'
        run: node scripts/signing-vault.mjs windows artifacts/signing-public
      - name: Native embedded-signature regression and negative cases
        if: inputs.signed && matrix.platform == 'win'
        run: node scripts/test-windows-signing.mjs
      - run: npm ci
      - run: npm run build:web:electron
      - run: node --test scripts/backend-env.test.mjs scripts/backend-lifecycle.test.mjs scripts/mac-runtime.test.mjs scripts/runtime-test-support.test.mjs
      - run: npm run build:python-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime-build-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/runtime-test-results
          if-no-files-found: ignore
      - run: npm --workspace apps/desktop run package -- --${{ matrix.platform }}
      - name: Verify Windows signatures before upload
        if: inputs.signed && matrix.platform == 'win'
        run: npm run test:desktop:signatures -- apps/desktop/release
      - run: node scripts/desktop-distributions.mjs collect apps/desktop/release artifacts/distributions
      - name: Collect public Windows certificate
        if: inputs.signed && matrix.platform == 'win'
        shell: bash
        run: cp artifacts/signing-public/* artifacts/distributions/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: internal-platform-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/distributions
          retention-days: 2
          if-no-files-found: error
      - name: Build a previous version for manual macOS/Linux replacement
        if: matrix.platform != 'win'
        shell: bash
        run: |
          npm --workspace apps/desktop exec -- electron-builder --config build.config.cjs --${{ matrix.platform }} --dir --publish never --config.extraMetadata.version=2.0.0-beta.6-ci.0 --config.directories.output=../../artifacts/manual-old
          node scripts/desktop-manual-version.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.platform != 'win'
        with:
          name: internal-manual-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/manual-fixture
          retention-days: 2
          if-no-files-found: error
      - name: Build signed update fixtures
        if: inputs.signed && matrix.platform == 'win'
        shell: bash
        run: |
          node scripts/signing-vault.mjs windows artifacts/signing-public
          npm --workspace apps/desktop exec -- electron-builder --config build.config.cjs --win --publish never --config.extraMetadata.version=2.0.0-beta.6-ci.0 --config.directories.output=../../artifacts/update-old
          npm --workspace apps/desktop exec -- electron-builder --config build.config.cjs --win --publish never --config.extraMetadata.version=2.0.0-beta.6-ci.1 --config.directories.output=../../artifacts/update-next
          npm run test:desktop:signatures -- artifacts/update-old
          npm run test:desktop:signatures -- artifacts/update-next
          node scripts/desktop-distributions.mjs collect artifacts/update-old artifacts/update-fixtures/old
          node scripts/desktop-distributions.mjs collect artifacts/update-next artifacts/update-fixtures/next
          cp artifacts/signing-public/windows.json artifacts/update-fixtures/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.signed && matrix.platform == 'win'
        with:
          name: internal-update-fixtures
          path: artifacts/update-fixtures
          retention-days: 2
          if-no-files-found: error
      - name: Remove temporary Windows CA trust
        if: always() && inputs.signed && matrix.platform == 'win'
        run: node scripts/windows-test-trust.mjs remove
      - name: Remove credentials
        if: always()
        shell: bash
        run: |
          if command -v az >/dev/null; then az account clear; fi
  verify:
    if: always() && !cancelled() && needs.build.result != 'skipped'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DATAM8_REQUIRE_SIGNING: ${{ inputs.signed && '1' || '0' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2t64 libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libasound2t64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: internal-platform-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/distributions
      - name: Configure explicit corporate CA trust for signature and update tests
        if: inputs.signed && matrix.platform == 'win'
        run: node scripts/windows-test-trust.mjs install
      - name: Read expected Windows identity
        if: inputs.signed && matrix.platform == 'win'
        shell: bash
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('artifacts/distributions/windows.json'));fs.appendFileSync(process.env.GITHUB_ENV,'DATAM8_WINDOWS_THUMBPRINT='+c.thumbprint+'\n');"
      - name: Verify downloaded Windows installer
        if: inputs.signed && matrix.platform == 'win'
        run: npm run test:desktop:signatures -- artifacts/distributions
      - run: node scripts/desktop-distributions.mjs install artifacts/distributions artifacts/installed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: matrix.platform != 'win'
        with:
          name: internal-manual-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/manual-fixture
      - name: Prepare previous version for manual replacement test
        if: matrix.platform != 'win'
        run: node scripts/desktop-manual-version.mjs install
      - name: Test installed desktop and runtime
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == linux ]]; then
            xvfb-run -a npm run test:desktop:packaged
          else
            npm run test:desktop:packaged
          fi
      - name: Uninstall
        run: node scripts/desktop-distributions.mjs uninstall artifacts/distributions artifacts/installed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.signed && matrix.platform == 'win'
        with:
          name: internal-update-fixtures
          path: artifacts/update-fixtures
      - name: Signed Windows updates and negative signature cases
        if: inputs.signed && matrix.platform == 'win'
        run: npm run test:desktop:updates -- artifacts/update-fixtures
      - name: Remove temporary Windows CA trust
        if: always() && inputs.signed && matrix.platform == 'win'
        run: node scripts/windows-test-trust.mjs remove
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/desktop-test-results
            artifacts/desktop-junit.xml
            artifacts/desktop-update-results
          retention-days: 30
  deliver:
    needs: [build, verify]
    if: inputs.signed && needs.build.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    environment: desktop-signing-v2
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
      DATAM8_GPG_FINGERPRINT: ${{ vars.DATAM8_GPG_FINGERPRINT }}
      DATAM8_GPG_KEY_SECRET: datam8-v2-gpg-private
      DATAM8_GPG_PASSPHRASE_SECRET: datam8-v2-gpg-passphrase
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: internal-platform-*
          merge-multiple: true
          path: artifacts/desktop-final
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_V2_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_KEY_VAULT_TENANT }}
          allow-no-subscriptions: true
      - name: Import GPG signing key from Vault
        run: node scripts/signing-vault.mjs gpg "$RUNNER_TEMP/datam8-gpg"
      - name: Record build identity and installation guidance
        run: |
          node scripts/final-desktop-manifest.mjs artifacts/desktop-final
      - name: Sign final distributions
        run: node scripts/desktop-signatures.mjs sign artifacts/desktop-final
      - name: Verify signatures and reject tampering and wrong keys
        run: node scripts/desktop-signatures.mjs verify-gpg artifacts/desktop-final
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: DataM8-verified-four-platforms
          path: artifacts/desktop-final
          retention-days: 14
          if-no-files-found: error
      - name: Remove signing key and Azure login
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/datam8-gpg" --kill all || true
          rm -rf "$RUNNER_TEMP/datam8-gpg"
          az account clear
