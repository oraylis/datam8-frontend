name: Python runtime and desktop acceptance
on:
  push:
    branches: [codex/python-runtime-slimming-all-platforms]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: python-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: macos-15, platform: mac, arch: arm64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node --test scripts/backend-env.test.mjs scripts/backend-lifecycle.test.mjs scripts/mac-runtime.test.mjs scripts/runtime-test-support.test.mjs
      # The builder tests a relocated copy with its own interpreter and fixtures.
      - run: npm run build:python-runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/runtime-test-results
            artifacts/python-runtime/runtime-manifest.json
          retention-days: 14
          if-no-files-found: warn
  desktop:
    needs: runtime
    uses: ./.github/workflows/desktop.yml
    with:
      signed: false
