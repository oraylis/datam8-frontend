name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  verified:
    uses: ./.github/workflows/desktop.yml
    with:
      signed: true
    secrets: inherit
  publish:
    needs: verified
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DataM8-verified-four-platforms
          path: verified
      - name: Publish only verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --generate-notes verified/* ;;
            *) gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes verified/* ;;
          esac
