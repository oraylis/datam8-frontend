name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install
        run: npm ci

      - name: Ensure Rollup native deps
        run: npm run ci:ensure-rollup-native

      - name: Build datam8 backend wheel
        run: npm run build:datam8-binaries

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (workspaces)
        run: npm --workspaces run test --if-present

      - name: CI gates (backend smoke)
        run: npm run ci:gates

      - name: Build web (electron mode)
        run: npm run build:web:electron

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: internal-web-dist
          path: apps/web/dist
          if-no-files-found: error

  package-desktop:
    name: Build desktop (${{ matrix.os }})
    needs: [quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: npm ci

      - name: Ensure Rollup native deps
        run: npm run ci:ensure-rollup-native

      - name: Build packaged Python runtime
        run: npm run build:python-runtime

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: internal-web-dist
          path: apps/web/dist

      - name: Package desktop (Windows)
        if: matrix.os == 'windows-latest'
        run: npm --workspace apps/desktop run package:win

      - name: Package desktop (macOS)
        if: matrix.os == 'macos-latest'
        run: npm --workspace apps/desktop run package:mac

      - name: Package desktop (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm --workspace apps/desktop run package:linux

      - name: Collect release artifacts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const repoRoot = process.cwd();
          const releaseDir = path.join(repoRoot, "apps", "desktop", "release");
          const outDir = path.join(repoRoot, "apps", "desktop", "release-artifacts");

          fs.rmSync(outDir, { recursive: true, force: true });
          fs.mkdirSync(outDir, { recursive: true });

          if (!fs.existsSync(releaseDir) || !fs.statSync(releaseDir).isDirectory()) {
            console.error(`Release directory does not exist: ${releaseDir}`);
            process.exit(1);
          }

          const entries = fs.readdirSync(releaseDir, { withFileTypes: true });
          let copied = 0;
          for (const entry of entries) {
            if (!entry.isFile()) continue;
            const src = path.join(releaseDir, entry.name);
            const dst = path.join(outDir, entry.name);
            fs.copyFileSync(src, dst);
            copied += 1;
          }

          if (!copied) {
            console.error(`No top-level artifact files found in ${releaseDir}`);
            process.exit(1);
          }

          console.log(`Collected ${copied} artifact file(s) into ${outDir}`);
          NODE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/release-artifacts
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [package-desktop]
    timeout-minutes: 15
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-artifacts

      - name: Collect assets + generate SHA256SUMS
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const inRoot = path.resolve("dist-artifacts");
          const outRoot = path.resolve("release-assets");
          fs.mkdirSync(outRoot, { recursive: true });

          function walk(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) files.push(...walk(full));
              else if (entry.isFile()) files.push(full);
            }
            return files;
          }

          const all = walk(inRoot);
          if (!all.length) {
            console.error("No artifacts downloaded under", inRoot);
            process.exit(1);
          }

          const rel = (p) => path.relative(inRoot, p);
          const artifactNameOf = (p) => rel(p).split(path.sep)[0] || "artifact";
          const baseNameOf = (p) => path.basename(p);

          const counts = new Map();
          for (const file of all) {
            const base = baseNameOf(file);
            counts.set(base, (counts.get(base) || 0) + 1);
          }

          const copied = [];
          for (const file of all) {
            const base = baseNameOf(file);
            const artifact = artifactNameOf(file).replace(/[^a-zA-Z0-9._-]+/g, "-");
            const targetName = (counts.get(base) || 0) > 1 ? `${artifact}-${base}` : base;
            const target = path.join(outRoot, targetName);
            fs.copyFileSync(file, target);
            copied.push(target);
          }

          copied.sort((a, b) => path.basename(a).localeCompare(path.basename(b)));
          const lines = [];
          for (const file of copied) {
            const buf = fs.readFileSync(file);
            const hash = crypto.createHash("sha256").update(buf).digest("hex");
            lines.push(`${hash}  ${path.basename(file)}`);
          }
          fs.writeFileSync(path.join(outRoot, "SHA256SUMS.txt"), lines.join("\n") + "\n", "utf-8");
          console.log(`Wrote ${copied.length} assets + SHA256SUMS.txt to ${outRoot}`);
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*

